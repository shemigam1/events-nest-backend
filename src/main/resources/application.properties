spring.application.name=events-nest-server
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/events_nest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.signing.key=boom-supersonic-flight-secret-key-long-enough
jwt.access-token.expiry-seconds=3600
jwt.refresh-token.expiry-seconds=604800

# Mail (via Resend HTTP API — https://resend.com/docs/api-reference/emails/send-email)
resend.api-key=${RESEND_API_KEY}
# `from` must be either onboarding@resend.dev (sandbox, only delivers to your
# Resend account email) or an address on a domain you've verified in Resend.
resend.from=${RESEND_FROM:EventsNest <onboarding@resend.dev>}

# Email job poller
email.job.poll-interval-ms=30000

# App
app.frontend-url=${FRONTEND_URL}

# Kafka — defaults to the EXTERNAL listener of the dockerized broker so
# `mvn spring-boot:run` works locally as long as `docker compose up broker`
# is running. Inside compose, the env var overrides this to broker:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer (notifications module)
spring.kafka.consumer.group-id=events-nest-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=group.moniepoint.eventsnestserver.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Topics
checkin.kafka.topic=ticket.checked-in
booking.kafka.topic=booking.confirmed
event-approved.kafka.topic=event.approved
event-rejected.kafka.topic=event.rejected

spring.config.import=optional:env.properties


