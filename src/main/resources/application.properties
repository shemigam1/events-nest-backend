spring.application.name=events-nest-server
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/events_nest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.signing.key=boom-supersonic-flight-secret-key-long-enough
jwt.access-token.expiry-seconds=3600
jwt.refresh-token.expiry-seconds=604800

spring.config.import=env.properties


