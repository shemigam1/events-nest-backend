spring.application.name=events-nest-server
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/events_nest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Schema is owned by Flyway (see src/main/resources/db/migration). Hibernate
# only validates that the entity model matches the migrated schema and
# refuses to start if it doesn't — that's the failure mode that previously
# went silent under ddl-auto=update (e.g. nullability changes not propagating).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway. baseline-on-migrate lets the already-populated local/staging DB
# adopt V1 as its baseline without re-executing V1's CREATE TABLEs. The
# baseline-version is set to 1 so V1 is recorded as "already applied" on
# DBs that already have the schema; future versions (V2, V3, …) run
# normally. A fresh database (CI, new dev machine) skips the baseline
# step and runs V1 from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Hibernate ddl-auto=update snapshot
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

jwt.signing.key=boom-supersonic-flight-secret-key-long-enough
jwt.access-token.expiry-seconds=3600
jwt.refresh-token.expiry-seconds=604800

# Mail provider — set to 'gmail' to switch (default: brevo).
# All secrets below come from environment variables; see ./env.example
# for the full list. Compose loads them from ./.env at the project root;
# in production the orchestrator (k8s, ECS, etc.) injects them.
mail.provider=${MAIL_PROVIDER:brevo}

# Brevo HTTP API
brevo.api-key=${BREVO_API_KEY:}
brevo.from=${FROM_EMAIL:aabc33001@smtp-brevo.com}

# Gmail SMTP — only used when mail.provider=gmail
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Bootstrap admin user (created on first startup if missing).
# ADMIN_PASSWORD has no default on purpose — startup must fail loudly
# rather than ship a known-default password to production.
admin.email=${ADMIN_EMAIL:admin@eventsnest.com}
admin.password=${ADMIN_PASSWORD}
admin.first-name=${ADMIN_FIRST_NAME:Platform}
admin.last-name=${ADMIN_LAST_NAME:Admin}

# Email job poller
email.job.poll-interval-ms=30000

# App
app.frontend-url=${FRONTEND_URL}

# Kafka — defaults to the EXTERNAL listener of the dockerized broker so
# `mvn spring-boot:run` works locally as long as `docker compose up broker`
# is running. Inside compose, the env var overrides this to broker:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Stamp every outbound record with the current MDC correlation ID so the
# downstream consumer can keep the same trace ID — see
# CorrelationIdProducerInterceptor / CorrelationIdRecordInterceptor.
spring.kafka.producer.properties.interceptor.classes=group.moniepoint.eventsnestserver.common.logging.CorrelationIdProducerInterceptor

# Consumer (notifications module).
# We deserialize to String at the Kafka layer and let StringJsonMessageConverter
# (configured in KafkaConsumerConfig) inspect each @KafkaListener method's
# parameter type — that way one consumer factory handles multiple event types
# without needing per-type listener containers or type headers in messages.
spring.kafka.consumer.group-id=events-nest-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topics
checkin.kafka.topic=ticket.checked-in
booking.kafka.topic=booking.confirmed
event-approved.kafka.topic=event.approved
event-rejected.kafka.topic=event.rejected

# Phase B telemetry: actuator endpoints. Prometheus scrapes /actuator/prometheus.
# Same port as the API for capstone simplicity; in prod you'd split to a
# dedicated management port via management.server.port=9090.
management.endpoints.web.exposure.include=health,info,prometheus
# show-details=always: the endpoint is public (so Docker/k8s probes can hit
# it without auth) and the per-indicator status is useful for debugging
# during ops review. Nothing in this response is sensitive — it lists
# indicator names like 'db', 'kafka', etc. and their UP/DOWN state.
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Health probes: split /actuator/health into /actuator/health/liveness
# (am I still running?) and /actuator/health/readiness (am I able to serve
# traffic? — DB up, etc.). Useful for Docker healthchecks and k8s probes.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# We send mail through Brevo's HTTP API, not SMTP, so the auto-configured
# mail health indicator (which probes SMTP connectivity using
# spring.mail.* credentials) reports DOWN — turn it off so the aggregate
# /actuator/health reflects what the app actually depends on.
management.health.mail.enabled=false

# Note: env.properties is no longer imported from the classpath. Secrets
# now come from real environment variables (see ./env.example). For local
# dev outside Docker, source ./.env or pass --spring.config.import on
# the command line — they will not be baked into the runnable jar.


