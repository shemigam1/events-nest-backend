spring.application.name=events-nest-server
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
# Postgres has no "create on connect" equivalent — the database must exist
# before the app starts. Compose creates it via POSTGRES_DB; RDS provisions
# it at the time the instance is created.
spring.datasource.url=jdbc:postgresql://localhost:5432/events_nest_db
spring.datasource.username=postgres
spring.datasource.password=postgres
# Schema is owned by Flyway (see src/main/resources/db/migration). Hibernate
# only validates that the entity model matches the migrated schema and
# refuses to start if it doesn't — that's the failure mode that previously
# went silent under ddl-auto=update (e.g. nullability changes not propagating).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway. baseline-on-migrate lets the already-populated local/staging DB
# adopt V1 as its baseline without re-executing V1's CREATE TABLEs. The
# baseline-version is set to 1 so V1 is recorded as "already applied" on
# DBs that already have the schema; future versions (V2, V3, …) run
# normally. A fresh database (CI, new dev machine) skips the baseline
# step and runs V1 from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Hibernate ddl-auto=update snapshot
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Multipart uploads. The application-level ImageValidator enforces the
# real 5MB limit for cover images; we set the multipart cap slightly above
# that so the framework doesn't reject before our validator can produce a
# clean error message.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Storage backend. local writes to ./uploads/ and serves at /uploads/**;
# s3 uses AWS S3 (requires app.storage.s3.bucket + region + creds).
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.root=${APP_STORAGE_LOCAL_ROOT:./uploads}
app.storage.local.public-base-url=${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.storage.local.app-base-url=${APP_STORAGE_LOCAL_APP_BASE_URL:http://localhost:8080}
app.storage.s3.presign-ttl-minutes=${APP_STORAGE_S3_PRESIGN_TTL_MINUTES:15}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:eu-west-1}
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}


# JWT signing key — required env var, no default. Like ADMIN_PASSWORD, the
# app refuses to boot without one, so we never ship a known-default key.
jwt.signing.key=${JWT_SIGNING_KEY}
jwt.access-token.expiry-seconds=3600
jwt.refresh-token.expiry-seconds=604800

# Mail provider — set to 'gmail' to switch (default: brevo).
# All secrets below come from environment variables; see ./env.example
# for the full list. Compose loads them from ./.env at the project root;
# in production the orchestrator (k8s, ECS, etc.) injects them.
mail.provider=${MAIL_PROVIDER:brevo}

# Brevo HTTP API
brevo.api-key=${BREVO_API_KEY:}
brevo.from=${FROM_EMAIL:aabc33001@smtp-brevo.com}

# Gmail SMTP — only used when mail.provider=gmail
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Bootstrap admin user (created on first startup if missing).
# ADMIN_PASSWORD has no default on purpose — startup must fail loudly
# rather than ship a known-default password to production.
admin.email=${ADMIN_EMAIL:admin@eventsnest.com}
admin.password=${ADMIN_PASSWORD}
admin.first-name=${ADMIN_FIRST_NAME:Platform}
admin.last-name=${ADMIN_LAST_NAME:Admin}

# ─── Redis ───────────────────────────────────────────────────────────────────
# Host/port can be overridden by env vars (SPRING_DATA_REDIS_HOST / _PORT).
# In compose the app service sets these to point at the redis container.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Email job poller
email.job.poll-interval-ms=30000

# App
app.frontend-url=${FRONTEND_URL}

# Kafka — defaults to the EXTERNAL listener of the dockerized broker so
# `mvn spring-boot:run` works locally as long as `docker compose up broker`
# is running. Inside compose, the env var overrides this to broker:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Stamp every outbound record with the current MDC correlation ID so the
# downstream consumer can keep the same trace ID — see
# CorrelationIdProducerInterceptor / CorrelationIdRecordInterceptor.
spring.kafka.producer.properties.interceptor.classes=group.moniepoint.eventsnestserver.common.logging.CorrelationIdProducerInterceptor

# Consumer (notifications module).
# We deserialize to String at the Kafka layer and let StringJsonMessageConverter
# (configured in KafkaConsumerConfig) inspect each @KafkaListener method's
# parameter type — that way one consumer factory handles multiple event types
# without needing per-type listener containers or type headers in messages.
spring.kafka.consumer.group-id=events-nest-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topics
checkin.kafka.topic=ticket.checked-in
booking.kafka.topic=booking.confirmed
event-approved.kafka.topic=event.approved
event-rejected.kafka.topic=event.rejected
contract-signed.kafka.topic=contract.signed
audit.kafka.topic=audit.events

# Phase B telemetry: actuator endpoints. Prometheus scrapes /actuator/prometheus.
# Same port as the API for capstone simplicity; in prod you'd split to a
# dedicated management port via management.server.port=9090.
management.endpoints.web.exposure.include=health,info,prometheus
# show-details=always: the endpoint is public (so Docker/k8s probes can hit
# it without auth) and the per-indicator status is useful for debugging
# during ops review. Nothing in this response is sensitive — it lists
# indicator names like 'db', 'kafka', etc. and their UP/DOWN state.
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Health probes: split /actuator/health into /actuator/health/liveness
# (am I still running?) and /actuator/health/readiness (am I able to serve
# traffic? — DB up, etc.). Useful for Docker healthchecks and k8s probes.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# We send mail through Brevo's HTTP API, not SMTP, so the auto-configured
# mail health indicator (which probes SMTP connectivity using
# spring.mail.* credentials) reports DOWN — turn it off so the aggregate
# /actuator/health reflects what the app actually depends on.
management.health.mail.enabled=false

# ─── Dev seeder ──────────────────────────────────────────────────────────────
# Set to true to seed demo users, events, and vendor applications on startup.
# NEVER enable in production — data is inserted once and skipped on repeat runs.
app.seeder.enabled=${APP_SEEDER_ENABLED:false}

# ─── OpenAPI / Swagger UI (SpringDoc) ────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Enable "Try it out" by default so testers can call endpoints directly from the UI.
springdoc.swagger-ui.try-it-out-enabled=true
# Show endpoints sorted by HTTP method for easier scanning.
springdoc.swagger-ui.operations-sorter=method
# Expand the first tag by default so the UI loads with something visible.
springdoc.swagger-ui.doc-expansion=list

# Note: env.properties is no longer imported from the classpath. Secrets
# now come from real environment variables (see ./env.example). For local
# dev outside Docker, source ./.env or pass --spring.config.import on
# the command line — they will not be baked into the runnable jar.


