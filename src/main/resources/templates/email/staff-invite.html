<!DOCTYPE html>
<html lang="en">
<body style="font-family:Arial,sans-serif;color:#333;max-width:600px;margin:auto;padding:24px;">

  <h2 style="color:#1a1a2e;">Check-In Staff Invitation</h2>

  <p>Hi <strong>{{staffName}}</strong>,</p>
  <p>You have been invited as check-in staff for <strong>{{eventTitle}}</strong>.</p>

  {{linkBlock}}

  {{eventIdBlock}}

  <div style="background:#f4f4f4;border-left:4px solid #3b4cca;padding:12px 16px;
              font-family:monospace;font-size:13px;word-break:break-all;">
    <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.06em;
                margin-bottom:4px;font-family:Arial,sans-serif;">Staff token</div>
    {{rawToken}}
  </div>

  <p style="color:#e53e3e;font-size:13px;margin-top:16px;">Keep this token private.</p>
  <p style="color:#888;font-size:13px;">Expires 24 hours after the event ends.</p>

  <hr style="border:none;border-top:1px solid #eee;margin-top:32px;"/>
  <p style="color:#aaa;font-size:12px;">EventsNest Platform</p>

</body>
</html>
