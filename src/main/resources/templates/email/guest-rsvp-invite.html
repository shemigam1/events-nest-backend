<!DOCTYPE html>
<html lang="en">
<body style="font-family:Arial,sans-serif;color:#333;max-width:600px;margin:auto;padding:24px;">

  <h2 style="color:#1a1a2e;">You're invited!</h2>

  <p>Hi <strong>{{guestName}}</strong>,</p>
  <p>You have been invited to <strong>{{eventTitle}}</strong>.</p>
  <p>Please let us know if you'll be attending by clicking one of the buttons below.</p>

  <div style="text-align:center;margin:32px 0;display:flex;gap:16px;justify-content:center;">
    <a href="{{rsvpAcceptUrl}}"
       style="background-color:#0F9D58;color:white;padding:14px 28px;
              text-decoration:none;border-radius:6px;font-size:16px;margin-right:12px;">
      ✓ Accept
    </a>
    <a href="{{rsvpDeclineUrl}}"
       style="background-color:#e53e3e;color:white;padding:14px 28px;
              text-decoration:none;border-radius:6px;font-size:16px;">
      ✗ Decline
    </a>
  </div>

  <p style="color:#888;font-size:13px;text-align:center;">
    Or paste this token on the RSVP page: <code style="background:#f4f4f4;padding:2px 6px;border-radius:4px;">{{rsvpToken}}</code>
  </p>

  <hr style="border:none;border-top:1px solid #eee;margin-top:32px;"/>
  <p style="color:#aaa;font-size:12px;">EventsNest Platform</p>

</body>
</html>
