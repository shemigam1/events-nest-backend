# Test profile — used by @SpringBootTest context-load checks.
# In-memory H2 stands in for Postgres so the context can wire up JPA without
# any external services running. Kafka and Mail auto-config are disabled
# because we don't need a broker or SMTP server just to verify the bean
# graph compiles. When we add real integration tests in M2.1+, swap this
# for Testcontainers Postgres for full fidelity.

spring.application.name=events-nest-server

# H2 in-memory DB, PostgreSQL compatibility mode so production-style SQL
# (native uuid, boolean) parses. NON_KEYWORDS=USER stops H2 from reserving
# the column name 'user'.
spring.datasource.url=jdbc:h2:mem:eventsnest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway is off in tests — H2 in-memory + create-drop builds the schema
# from JPA entities for each context, which is faster and avoids needing
# a Postgres-specific migration to run on H2.
spring.flyway.enabled=false

# Don't load env.properties or boot up docker-compose during tests.
spring.config.import=
spring.docker.compose.enabled=false

# Disable Kafka, Mail, and Redis auto-configuration — no external services in CI.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Storage: local mode so no S3/AWS calls during tests.
app.storage.type=local
app.storage.local.root=./test-uploads
app.storage.local.public-base-url=http://localhost:8080/uploads

# Required app properties.
jwt.signing.key=test-signing-key-long-enough-for-hmac-sha256
jwt.access-token.expiry-seconds=3600
jwt.refresh-token.expiry-seconds=604800
app.frontend-url=http://localhost:5173
mail.provider=brevo
brevo.api-key=test
brevo.from=test@example.com

# Pin Kafka topic names so any bean that @Value-injects them still resolves.
checkin.kafka.topic=ticket.checked-in
booking.kafka.topic=booking.confirmed
event-approved.kafka.topic=event.approved
event-rejected.kafka.topic=event.rejected
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=events-nest-test
spring.kafka.producer.properties.interceptor.classes=

# SpringDoc — keep enabled so Swagger endpoint beans wire up in test context.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Email poller stays quiet during tests.
email.job.poll-interval-ms=3600000

# Admin bootstrap (no env vars in CI). Production secrets come from .env
# / orchestrator-injected env vars; tests just need any value that
# satisfies the @Value placeholders.
admin.email=admin@test.local
admin.password=test-admin-password
admin.first-name=Test
admin.last-name=Admin
