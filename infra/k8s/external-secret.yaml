# Pulls every key from the AWS Secrets Manager secret `eventsnest/prod/app`
# into a native Kubernetes Secret named `app-secrets` in this namespace.
#
# `dataFrom.extract` flattens the JSON object stored in Secrets Manager so
# each top-level key (ADMIN_EMAIL, BREVO_API_KEY, etc.) becomes its own
# entry in the k8s Secret — which then gets `envFrom`-loaded into the app
# container in deployment.yaml as one block of env vars.
#
# refreshInterval=1h: ESO re-fetches every hour. To pick up a secret change
# faster, delete the k8s Secret (`kubectl delete secret app-secrets -n events-nest`)
# and ESO will recreate it within seconds; then restart the pod
# (`kubectl rollout restart deployment/events-nest-server -n events-nest`)
# to load the new values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: events-nest
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: eventsnest/prod/app
