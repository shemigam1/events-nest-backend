# In-cluster Service for the app.
#
# Type: ClusterIP — the Ingress (which fronts the ALB) targets this Service
# by name. We don't need a NodePort or LoadBalancer here because the AWS
# Load Balancer Controller (installed in step 7) creates the public ALB
# directly from the Ingress resource.
#
# `port: 80` — the port the Service exposes inside the cluster.
# `targetPort: http` — references the named port on the pod (8080).
apiVersion: v1
kind: Service
metadata:
  name: events-nest-server
  namespace: events-nest
  labels:
    app: events-nest-server
spec:
  type: ClusterIP
  selector:
    app: events-nest-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
