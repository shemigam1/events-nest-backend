# Tells External Secrets Operator how to talk to AWS Secrets Manager.
#
# Authentication uses IRSA (IAM Roles for Service Accounts): the
# `external-secrets-sa` ServiceAccount in this namespace was created with
# `eksctl create iamserviceaccount ... --attach-policy-arn arn:aws:iam::aws:policy/SecretsManagerReadWrite`
# in step 7, which mints an IAM role and patches the SA's annotation so the
# pod assumes the role via the cluster's OIDC provider — no static AWS keys
# anywhere in the cluster.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: events-nest
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
