# Auto-provisioned datasource: Prometheus, reachable at the docker service name.
# Loaded on Grafana boot — no UI clicks required.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
