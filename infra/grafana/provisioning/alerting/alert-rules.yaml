apiVersion: 1

groups:
  - orgId: 1
    name: HTTP Errors
    folder: EventsNest
    interval: 1m
    rules:
      - uid: http-5xx-errors
        title: HTTP 5xx Errors Detected
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: sum(increase(http_server_requests_seconds_count{status=~"5.."}[1m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        # Fire the moment any 5xx appears — no grace period.
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "HTTP 5xx errors on EventsNest"
          description: "{{ $value | printf \"%.0f\" }} HTTP 5xx error(s) in the last minute on {{ $labels.uri }}."
        labels:
          severity: critical
        isPaused: false
