# Auto-provisioned dashboard provider: tells Grafana to load every JSON
# file under /var/lib/grafana/dashboards as a dashboard, refreshing every
# 30s so editing the JSON during dev is reflected without a Grafana restart.

apiVersion: 1

providers:
  - name: EventsNest
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
