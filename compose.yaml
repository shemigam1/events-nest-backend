name: events-nest

services:
  mysql:
    image: mysql:8.4
    container_name: events-nest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: events_nest_db
      MYSQL_USER: events
      MYSQL_PASSWORD: events
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  broker:
    image: apache/kafka:latest
    container_name: events-nest-broker
    restart: unless-stopped
    ports:
      # 9092 is for in-network containers (advertised as broker:9092).
      # 9094 is for host-machine tooling (advertised as localhost:9094) —
      # use this from `kafka-console-consumer` etc. running on your laptop.
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: events-nest-server:local
    container_name: events-nest-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events_nest_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-boom supersonic flight}
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      # MAIL_* and FRONTEND_URL are sourced from src/main/resources/env.properties
      # (classpath, baked into the jar at build time). Override here only when
      # you want a deploy-specific value without rebuilding.
    ports:
      - "8080:8080"
    networks:
      - backend

  # Drop new infra services here (redis, prometheus, grafana, ...). Attach them
  # to the `backend` network so the app can reach them by service name.

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
