name: events-nest

services:
  postgres:
    image: postgres:16-alpine
    container_name: events-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_nest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_nest_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  broker:
    image: apache/kafka:latest
    container_name: events-nest-broker
    restart: unless-stopped
    ports:
      # 9092 is for in-network containers (advertised as broker:9092).
      # 9094 is for host-machine tooling (advertised as localhost:9094) —
      # use this from `kafka-console-consumer` etc. running on your laptop.
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: events-nest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: events-nest-server:local
    container_name: events-nest-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Phase B observability services — chained here so that any time `app`
      # starts (whether via `docker compose up app` or
      # `mvn spring-boot:run`'s docker-compose integration), the dashboard
      # comes up with it. They use `service_started` (not `_healthy`) so
      # the app doesn't wait for Grafana to fully boot before booting itself.
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
    # Secrets and per-deployment config (admin bootstrap, mail provider keys,
    # frontend URL, JWT signing key) come from ./.env at the project root.
    # See ./env.example for the full list. The .env file is gitignored so
    # nothing in this compose file is sensitive on its own.
    env_file:
      - .env
    environment:
      # In-compose connection details — these override anything in .env so
      # the app always points at the sibling Postgres/Kafka services
      # regardless of what's set for host-machine runs.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/events_nest_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      # Phase A telemetry: rolling JSON log files. Mounted to ./logs on the
      # host so you can `tail -f logs/app.log` without needing to exec into
      # the container. Phase C will add a log shipper that consumes from here
      # and pushes to S3.
      - ./logs:/app/logs
    # Healthcheck via bash's /dev/tcp builtin — no need to bake curl/wget
    # into the JRE image. Hits /actuator/health/readiness so the container
    # only flips to 'healthy' once Spring is fully up and able to serve
    # traffic (DB reachable, etc.). start_period gives Spring enough time
    # to boot before failures count.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE '^HTTP/1\\.[01] 200'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ─── Phase B telemetry ───────────────────────────────────────────────
  # Prometheus scrapes /actuator/prometheus on the app every 5s; Grafana
  # reads from Prometheus and auto-loads the EventsNest dashboard from
  # provisioning files. Anonymous viewer access is on so the demo recording
  # can show the dashboard without a login flow.

  prometheus:
    image: prom/prometheus:latest
    container_name: events-nest-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: events-nest-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  backend:
    driver: bridge
