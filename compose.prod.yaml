name: events-nest-prod

# Production compose for a single EC2 host.
#
# Differences from local compose.yaml:
#   * No `postgres` service — Postgres lives in RDS, the app connects via
#     SPRING_DATASOURCE_URL from .env.
#   * No `app.build` — image is pulled from ECR. The IMAGE_TAG env var
#     selects which build to run (default :latest).
#   * App host-binds to :80 — no reverse proxy needed because CloudFront
#     terminates TLS upstream and connects to origin over plain HTTP.
#   * Kafka EXTERNAL listener removed — no point exposing 9094 publicly.
#     In-cluster traffic uses PLAINTEXT://broker:9092 unchanged.
#   * Prometheus + Grafana NOT host-published — reach them via SSH tunnel
#     instead. Keeps them off the public internet without extra auth.
#
# To deploy a specific image tag:
#   ECR_REGISTRY=123456789012.dkr.ecr.eu-north-1.amazonaws.com \
#   IMAGE_TAG=42-abc1234 \
#   docker compose -f compose.prod.yaml up -d app
#
# GHA does this automatically — see .github/workflows/deploy.yml.

services:
  broker:
    image: apache/kafka:latest
    container_name: events-nest-broker
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Only the in-network listener is needed on the EC2.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: events-nest-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    # ECR_REGISTRY + IMAGE_TAG come from the environment. GHA exports them
    # before running `docker compose ... up`. Falls back to :latest so a
    # manual `docker compose pull && up -d` works without re-exporting.
    image: ${ECR_REGISTRY}/events-nest:${IMAGE_TAG:-latest}
    container_name: events-nest-server
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # In-host service hostnames override anything in .env so the app
      # always reaches the sibling containers regardless of dev config.
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      # Bind container 8080 to host port 80 — CloudFront origin connects
      # here over plain HTTP. TLS is handled by CloudFront upstream.
      - "80:8080"
    volumes:
      # Named volume (not a host bind) so Docker handles ownership for the
      # in-container `spring` user (UID < 1000). A host bind to ./logs would
      # inherit the host's `ubuntu` UID/GID and the container couldn't write
      # to it. To inspect logs from the host:
      #   docker logs events-nest-server --tail=100        (preferred)
      #   docker exec events-nest-server tail -f /app/logs/app.log
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE '^HTTP/1\\.[01] 200'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks:
      - backend

  # ─── Observability (internal-only) ──────────────────────────────────
  # Reach via SSH tunnel:
  #   ssh -i ~/.ssh/eventsnest-ec2.pem -L 9090:localhost:9090 -L 3000:localhost:3000 ubuntu@<ec2-ip>
  # Then open http://localhost:9090 (Prom) or :3000 (Grafana) on your laptop.

  prometheus:
    image: prom/prometheus:latest
    container_name: events-nest-prometheus
    restart: unless-stopped
    ports:
      # 127.0.0.1 binding — only reachable via SSH tunnel, not from the
      # public internet. Skip this section entirely if you don't need it
      # in prod.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: events-nest-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # In prod, set this via .env as GF_SECURITY_ADMIN_PASSWORD — default
      # `admin` is for local-only.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No anonymous viewer in prod — accessed via SSH tunnel by an
      # authenticated operator.
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  app_logs:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
