# CI/CD pipeline for AWS EKS.
#
# Triggered on push to main:
#   1. Run the JUnit suite (must pass before anything ships)
#   2. Build the Docker image and push to ECR with a sha-tagged label
#   3. Authenticate kubectl to the EKS cluster
#   4. Substitute the image URI into deployment.yaml and apply it
#   5. Block on the rollout finishing — pod must hit Ready
#
# The IAM user behind the secrets here is `eventsnest-cicd` (step 4 of the
# deploy plan), permissioned only to push to ECR and describe EKS — broad
# kubectl access comes from the cluster's aws-auth ConfigMap mapping the
# user into the system:masters group, configured via `eksctl create
# iamidentitymapping` in step 6.

name: CI/CD to AWS EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: events-nest
  IMAGE_TAG: ${{ github.run_number }}-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn -B test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          # Also tag :latest for ad-hoc rollbacks via `kubectl set image ... :latest`
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Apply Kubernetes manifests
        run: |
          # Static manifests (idempotent — applying repeatedly is safe).
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/secret-store.yaml
          kubectl apply -f infra/k8s/external-secret.yaml
          kubectl apply -f infra/k8s/service.yaml
          kubectl apply -f infra/k8s/ingress.yaml
          kubectl apply -f infra/k8s/servicemonitor.yaml || true
          # ServiceMonitor uses a CRD that only exists if kube-prometheus-stack
          # is installed. `|| true` keeps the deploy green on a fresh cluster
          # before monitoring is set up.

      - name: Deploy app
        run: |
          # Substitute the image URI into the Deployment manifest and apply.
          sed "s|PLACEHOLDER_IMAGE|$IMAGE_URI|g" infra/k8s/deployment.yaml \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/events-nest-server \
            -n events-nest \
            --timeout=5m

      - name: Show ALB endpoint
        if: success()
        run: |
          ALB=$(kubectl get ingress events-nest-server -n events-nest \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -n "$ALB" ]; then
            echo "::notice ::App reachable at http://$ALB"
          else
            echo "::warning ::Ingress has not been assigned an ALB yet (first deploy can take ~3 min after the AWS Load Balancer Controller picks it up)"
          fi

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "=== Deployment ==="
          kubectl describe deployment/events-nest-server -n events-nest
          echo "=== Pods ==="
          kubectl get pods -n events-nest -o wide
          echo "=== Recent events ==="
          kubectl get events -n events-nest --sort-by='.lastTimestamp' | tail -30
          echo "=== App logs ==="
          kubectl logs -n events-nest -l app=events-nest-server --tail=200 --all-containers || true
          echo "=== ExternalSecret status ==="
          kubectl describe externalsecret/app-secrets -n events-nest || true
